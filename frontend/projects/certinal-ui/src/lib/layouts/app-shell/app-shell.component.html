<div class="flex flex-col h-full overflow-hidden bg-bg-page">
  <!-- Header slot (always full-width, top) -->
  <ng-content select="[header]" />

  <!-- Body row -->
  <div class="flex-1 flex overflow-hidden min-h-0">
    <!-- Sidebar (desktop only) + hover toggle -->
    @if (isDesktop()) {
      <div class="group relative flex-shrink-0 h-full">
        <ng-content select="[sidebar]" />

        <button
          type="button"
          class="absolute top-1/2 -right-3 -translate-y-1/2 w-6 h-6 z-20
                 inline-flex items-center justify-center
                 rounded-full bg-bg-surface border border-border-default shadow-md
                 text-text-muted cursor-pointer
                 opacity-0 pointer-events-none
                 transition-[opacity,color,border-color] duration-200 ease-out
                 group-hover:opacity-100 group-hover:pointer-events-auto
                 hover:text-text-primary hover:border-emerald-400
                 focus-visible:opacity-100 focus-visible:pointer-events-auto
                 focus-visible:outline-3 focus-visible:outline-emerald-400 focus-visible:outline-offset-2"
          [attr.aria-label]="
            sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'
          "
          [attr.aria-expanded]="!sidebarCollapsed()"
          (click)="toggleSidebar()"
        >
          <cui-icon
            [name]="sidebarCollapsed() ? 'panel-left-open' : 'panel-left-close'"
            size="sm"
          />
        </button>
      </div>
    }

    <!-- Main content (scrollable) -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden">
      <div class="mx-auto w-full" [style]="contentStyle()">
        <ng-content />
      </div>
    </main>
  </div>
</div>

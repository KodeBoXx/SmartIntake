<button
  type="button"
  [class]="rootClasses()"
  [disabled]="disabled()"
  [attr.aria-current]="active() ? 'page' : null"
  [attr.title]="collapsed() ? label() : null"
  (click)="onClick()"
>
  @if (active()) {
    <span
      class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 rounded-r bg-success"
      aria-hidden="true"
    ></span>
  }

  @if (icon(); as iconName) {
    <cui-icon [name]="iconName" size="md" />
  }

  @if (!collapsed()) {
    <span class="flex-1 truncate">{{ label() }}</span>
    @if (hasBadge()) {
      <span [class]="badgePillClasses()">{{ badge() }}</span>
    }
  } @else if (hasBadge()) {
    <span
      class="absolute top-1.5 right-3 w-2 h-2 rounded-full bg-error"
      aria-hidden="true"
    ></span>
  }
</button>

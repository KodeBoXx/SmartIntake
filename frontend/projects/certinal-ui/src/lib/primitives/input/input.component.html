@if (label()) {
  <label [for]="inputId()" class="block type-label text-text-secondary mb-1.5">
    {{ label() }}
    @if (required()) {
      <span class="text-error ml-0.5" aria-hidden="true">*</span>
    }
  </label>
}

@if (isTextarea()) {
  <!-- Textarea variant — no prefix/suffix icon slots -->
  <div [class]="textareaWrapperClasses()">
    <textarea
      [id]="inputId()"
      [attr.name]="name() ?? null"
      [rows]="rows()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readonly]="readOnly()"
      [required]="required()"
      [attr.minlength]="minlength() ?? null"
      [attr.maxlength]="maxlength() ?? null"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [class]="textareaClasses()"
    ></textarea>
  </div>
} @else {
  <!-- Single-line inputs -->
  <div [class]="wrapperClasses()">
    @if (effectivePrefixIcon(); as iconName) {
      <span [class]="iconWrapperClasses()">
        <cui-icon [name]="iconName" [size]="iconSize()" />
      </span>
    }

    <input
      [id]="inputId()"
      [type]="effectiveType()"
      [attr.name]="name() ?? null"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readonly]="readOnly()"
      [required]="required()"
      [attr.min]="min() ?? null"
      [attr.max]="max() ?? null"
      [attr.step]="step() ?? null"
      [attr.minlength]="minlength() ?? null"
      [attr.maxlength]="maxlength() ?? null"
      [attr.pattern]="pattern() ?? null"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [class]="inputClasses()"
    />

    @if (isPassword()) {
      <button
        type="button"
        (click)="togglePassword()"
        [class]="trailingButtonClasses()"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
      >
        @if (passwordVisible()) {
          <!-- eye-off -->
          <svg
            [attr.width]="iconSize() === 'xs' ? 12 : 16"
            [attr.height]="iconSize() === 'xs' ? 12 : 16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" y1="2" x2="22" y2="22" />
          </svg>
        } @else {
          <!-- eye -->
          <svg
            [attr.width]="iconSize() === 'xs' ? 12 : 16"
            [attr.height]="iconSize() === 'xs' ? 12 : 16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    } @else if (suffixIcon()) {
      <span [class]="iconWrapperClasses()">
        <cui-icon [name]="suffixIcon()!" [size]="iconSize()" />
      </span>
    }
  </div>
}

@if (error()) {
  <p class="type-caption text-error mt-1.5">{{ error() }}</p>
} @else if (hint()) {
  <p class="type-caption text-text-muted mt-1.5">{{ hint() }}</p>
}

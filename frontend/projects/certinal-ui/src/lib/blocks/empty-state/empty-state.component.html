<div class="flex flex-col items-center justify-center text-center py-12 px-6">
  <div class="w-12 h-12 rounded-full bg-bg-subtle flex items-center justify-center mb-4">
    <cui-icon [name]="icon()" size="lg" class="text-text-faint" />
  </div>
  <div class="type-h4 text-text-primary mb-1">{{ title() }}</div>
  @if (description()) {
    <div class="type-body-sm text-text-muted max-w-md">{{ description() }}</div>
  }
  <div class="mt-4 empty:hidden">
    <ng-content select="[cuiEmptyAction]" />
  </div>
</div>

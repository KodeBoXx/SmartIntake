  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 200
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    CanonicalInt64:
      type: string
      pattern: ^(0|-[1-9][0-9]*|[1-9][0-9]*)$
      format: canonical-int64
      description: Canonical signed int64 base-10 string; JSON number is forbidden.
    CanonicalDecimal:
      type: string
      pattern: ^(?:0|-[1-9][0-9]*|[1-9][0-9]*)(?:\.[0-9]*[1-9])?$
      format: canonical-decimal
      description: Canonical expression-result decimal string with no redundant fractional zeroes; JSON number is forbidden.
    Diagnostic:
      type: object
      additionalProperties: false
      required:
      - pointer
      - messageKey
      - severity
      - parameters
      properties:
        fieldId:
          type: string
        instanceId:
          type: string
        rowPath:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - itemId
            properties:
              itemId:
                $ref: '#/components/schemas/OpaqueId'
              parentItemId:
                $ref: '#/components/schemas/OpaqueId'
        pointer:
          type: string
          pattern: ^/
        messageKey:
          type: string
        severity:
          enum:
          - error
          - warning
        parameters:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - boolean
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - detail
      - requestId
      - errors
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[A-Z0-9_]+$
        detail:
          type: string
        requestId:
          $ref: '#/components/schemas/OpaqueId'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    Acknowledgment:
      type: object
      additionalProperties: false
      required:
      - fieldId
      - accepted
      properties:
        fieldId:
          type: string
          minLength: 1
        accepted:
          const: true
    SessionMutation:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - value
        properties:
          op:
            const: set
          fieldId:
            type: string
          value:
            anyOf:
            - $ref: ./input-answer.schema.json
            - $ref: '#/components/schemas/CanonicalInt64'
            - $ref: '#/components/schemas/CanonicalDecimal'
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        properties:
          op:
            const: clear
          fieldId:
            type: string
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - itemId
        properties:
          op:
            enum:
            - addItem
            - removeItem
          fieldId:
            type: string
          itemId:
            $ref: '#/components/schemas/OpaqueId'
    SubmissionFilter:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: array
          minItems: 1
          items:
            enum:
            - submitted
            - voided
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    PublishedSchema:
      type: object
      additionalProperties: true
      required:
      - $schema
      - $id
      properties:
        $schema:
          const: https://json-schema.org/draft/2020-12/schema
        $id:
          type: string
          format: uri
      description: A complete Draft 2020-12 schema document. Keywords, $defs, recursive references and extension annotations
        are intentionally preserved.
    CapabilityRegistry:
      type: object
      additionalProperties: false
      required:
      - registryVersion
      - contractVersion
      - versions
      - schemas
      - fieldCatalog
      - controlValueCompatibility
      - operatorSignatures
      - limits
      - operations
      - assetSupplement
      - openapi
      - generation
      - fieldTypes
      - operators
      properties:
        registryVersion:
          type: string
        contractVersion:
          const: 4.0.0
        versions:
          type: object
          required:
          - contract
          - openapi
          - schemaDialect
          - java
          - typescript
          additionalProperties:
            type: string
        schemas:
          type: array
          minItems: 7
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - version
            - id
            - sha256
            - file
            - resource
            properties:
              kind:
                type: string
              version:
                const: 4.0.0
              id:
                type: string
              sha256:
                $ref: '#/components/schemas/Sha256'
              file:
                type: string
              resource:
                type: string
        fieldCatalog:
          type: array
          minItems: 17
          items:
            type: object
            additionalProperties: false
            required:
            - row
            - controls
            - canonicalTypes
            properties:
              row:
                type: integer
                minimum: 1
              controls:
                type: array
                minItems: 1
                items:
                  type: string
              canonicalTypes:
                type: array
                items:
                  type: string

          value: &id015
            $ref: '#/components/schemas/InputAnswerValue'
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        properties:
          op:
            const: clear
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - reason
        properties:
          op:
            const: markInvalid
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'

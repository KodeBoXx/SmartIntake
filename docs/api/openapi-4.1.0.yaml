          pattern: ^[A-Z0-9_]+$
        detail:
          type: string
        requestId:
          $ref: '#/components/schemas/OpaqueId'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    Acknowledgment:

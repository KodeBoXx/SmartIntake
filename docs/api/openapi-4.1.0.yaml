      - messageKey
      - severity
      - parameters
      properties:
        fieldId:
          type: string
        instanceId:
          type: string
        rowPath:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - itemId
            properties:
              itemId:
                $ref: '#/components/schemas/OpaqueId'
              parentItemId:

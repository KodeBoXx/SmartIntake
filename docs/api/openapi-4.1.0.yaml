  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 200
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    CanonicalInt64:
      type: string
      pattern: ^(0|-[1-9][0-9]*|[1-9][0-9]*)$
      format: canonical-int64
      description: Canonical signed int64 base-10 string; JSON number is forbidden.
    CanonicalDecimal:
      type: string
      pattern: ^(?:0|-?[1-9][0-9]*|-?(?:0|[1-9][0-9]*)\.[0-9]*[1-9])$
      format: canonical-decimal
      description: Canonical expression-result decimal string with no redundant fractional
        zeroes; JSON number is forbidden.
    Diagnostic:
      type: object
      additionalProperties: false
      required:

            const: UNPARSEABLE_INPUT
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - itemId
        properties:
          op:
            const: addItem
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
          itemId: &id016
            $ref: '#/components/schemas/OpaqueId'

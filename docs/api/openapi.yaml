openapi: 3.1.0
info: { title: Smart Intake API, version: 1.1.0 }
servers: [{ url: http://localhost:8080/v1 }]
paths:
  /health: { get: { responses: { '200': { description: Health status } } } }
  /capabilities: { get: { responses: { '200': { description: Contract and evaluator capabilities } } } }
  /workspaces/{workspace}/forms:
    get: { parameters: [{name: workspace,in: path,required: true,schema: {type: string}}], responses: {'200': {description: Catalog}} }
    post: { parameters: [{name: workspace,in: path,required: true,schema: {type: string}}], requestBody: {required: true,content: {application/json: {schema: {type: object,required: [formKey,title],properties: {formKey: {type: string},title: {type: string}}}}}}, responses: {'201': {description: Draft created},'422': {description: Invalid form key}} }
  /public/forms/{shareId}/sessions:
    post: { parameters: [{name: shareId,in: path,required: true,schema: {type: string,format: uuid}}], responses: {'201': {description: Session started}} }
  /sessions/{sessionId}:
    get: { parameters: [{name: sessionId,in: path,required: true,schema: {type: string,format: uuid}}], responses: {'200': {description: Draft session}} }
    patch: { parameters: [{name: sessionId,in: path,required: true,schema: {type: string,format: uuid}}], responses: {'200': {description: Autosaved},'409': {description: Revision conflict}} }

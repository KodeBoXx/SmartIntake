@if (label()) {
  <label [for]="inputId()" class="block type-label text-text-secondary mb-1.5">
    {{ label() }}
    @if (required()) {
      <span class="text-error ml-0.5" aria-hidden="true">*</span>
    }
  </label>
}

<div class="relative">
  <button
    type="button"
    [id]="inputId()"
    role="combobox"
    [attr.aria-haspopup]="'dialog'"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-invalid]="hasError() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [disabled]="isDisabled()"
    [attr.name]="name() ?? null"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
    [class]="triggerClasses()"
  >
    @if (prefixIcon()) {
      <span [class]="iconWrapperClasses()">
        <cui-icon [name]="prefixIcon()!" [size]="iconSize()" />
      </span>
    }
    <span [class]="labelClasses()">{{ displayLabel() }}</span>
  </button>

  @if (isOpen()) {
    <div [class]="panelClasses" role="dialog">
      <div class="flex">
        <cui-calendar
          mode="single"
          [selected]="pendingDate()"
          [(viewMonth)]="viewMonth"
          [min]="min()"
          [max]="max()"
          [disabledDates]="disabledDates()"
          [weekStartsOn]="weekStartsOn()"
          [locale]="locale()"
          (daySelect)="onDaySelect($event)"
        />

        <div class="border-l border-border-default flex">
          <cui-time-column
            [hour]="pendingHour()"
            [minute]="pendingMinute()"
            [step]="step()"
            [use24Hour]="resolvedUse24Hour()"
            (hourChange)="pendingHour.set($event)"
            (minuteChange)="pendingMinute.set($event)"
          />
        </div>
      </div>

      <div [class]="footerClasses">
        <div class="flex items-center gap-1">
          <button type="button" [class]="footerLinkClasses" (click)="onNowClick()">
            Now
          </button>
          @if (clearable() && hasValue()) {
            <button type="button" [class]="footerLinkClasses" (click)="onClearClick()">
              Clear
            </button>
          }
        </div>
        <button
          type="button"
          [class]="footerPrimaryClasses"
          [disabled]="!canApply()"
          (click)="onApplyClick()"
        >
          Apply
        </button>
      </div>
    </div>
  }
</div>

@if (error()) {
  <p class="type-caption text-error mt-1.5">{{ error() }}</p>
} @else if (hint()) {
  <p class="type-caption text-text-muted mt-1.5">{{ hint() }}</p>
}

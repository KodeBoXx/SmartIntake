<!-- Section header -->
<button
  type="button"
  [class]="headerClasses()"
  [attr.aria-expanded]="expanded()"
  [attr.title]="collapsed() ? label() : null"
  (click)="toggle()"
>
  @if (hasActiveChild()) {
    <span
      class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 rounded-r bg-success"
      aria-hidden="true"
    ></span>
  }

  @if (icon(); as iconName) {
    <cui-icon [name]="iconName" size="md" />
  }

  @if (!collapsed()) {
    <span class="flex-1 truncate">{{ label() }}</span>
    <cui-icon [name]="expanded() ? 'chevron-down' : 'chevron-right'" size="sm" />
  }
</button>

<!-- Children — shown when expanded (and always in collapsed rail mode) -->
@if (expanded() || collapsed()) {
  <ng-content />
}

<div [class]="containerClasses()" role="alert">
  <cui-icon [name]="iconName()" size="md" [class]="iconClasses()" />

  <div class="flex-1 min-w-0">
    @if (title()) {
      <div [class]="titleClasses()">{{ title() }}</div>
    }
    <div class="type-body-sm text-text-secondary">
      <ng-content />
    </div>
  </div>

  @if (closable()) {
    <cui-icon-button
      size="sm"
      ariaLabel="Dismiss alert"
      (buttonClick)="closed.emit()"
    >
      <cui-icon name="close" size="xs" />
    </cui-icon-button>
  }
</div>

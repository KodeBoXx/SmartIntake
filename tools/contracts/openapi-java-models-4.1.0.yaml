  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/badrequest
                title: Malformed request
                status: 400
                code: BADREQUEST
                detail: Malformed request
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    Unauthenticated:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/unauthenticated
                title: Authentication is required
                status: 401
                code: UNAUTHENTICATED
                detail: Authentication is required
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    Forbidden:
      description: Scope is insufficient
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/forbidden
                title: Scope is insufficient
                status: 403
                code: FORBIDDEN
                detail: Scope is insufficient
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    NotFound:
      description: Resource is absent or concealed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/notfound
                title: Resource is absent or concealed
                status: 404
                code: NOTFOUND
                detail: Resource is absent or concealed
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    Conflict:
      description: Replay or state conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/conflict
                title: Replay or state conflict
                status: 409
                code: CONFLICT
                detail: Replay or state conflict
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    PreconditionFailed:
      description: ETag is stale
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/preconditionfailed
                title: ETag is stale
                status: 412
                code: PRECONDITIONFAILED
                detail: ETag is stale
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    PreconditionRequired:
      description: If-Match is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/preconditionrequired
                title: If-Match is required
                status: 428
                code: PRECONDITIONREQUIRED
                detail: If-Match is required
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    Unprocessable:
      description: Semantic validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/unprocessable
                title: Semantic validation failed
                status: 422
                code: UNPROCESSABLE
                detail: Semantic validation failed
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3
                errors: []
    RateLimited:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            problem:
              value:
                type: https://api.smartintake.invalid/problems/ratelimited
                title: Rate limit exceeded
                status: 429
                code: RATELIMITED
                detail: Rate limit exceeded
                requestId: req-01J2W5RFR3K24SFWDX2C0N9VW3

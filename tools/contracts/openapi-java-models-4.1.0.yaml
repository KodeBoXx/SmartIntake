                errors: []
  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 200
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    CanonicalInt64:
      type: string
      pattern: ^(0|-[1-9][0-9]*|[1-9][0-9]*)$
      format: canonical-int64
      description: Canonical signed int64 base-10 string; JSON number is forbidden.
    CanonicalDecimal:
      type: string
      pattern: ^(?:0|-?[1-9][0-9]*|-?(?:0|[1-9][0-9]*)\.[0-9]*[1-9])$
      format: canonical-decimal
      description: Canonical expression-result decimal string with no redundant fractional zeroes; JSON number is forbidden.
    Diagnostic:
      type: object
      additionalProperties: false
      required:
      - pointer
      - messageKey
      - severity
      - parameters
      properties:
        fieldId:
          type: string
        instanceId:
          type: string
        rowPath:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - itemId
            properties:
              itemId:
                $ref: '#/components/schemas/OpaqueId'
              parentItemId:
                $ref: '#/components/schemas/OpaqueId'
        pointer:
          type: string
          pattern: ^/
        messageKey:
          type: string
        severity:
          enum:
          - error
          - warning
        parameters:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - boolean
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - detail
      - requestId
      - errors
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[A-Z0-9_]+$
        detail:
          type: string
        requestId:
          $ref: '#/components/schemas/OpaqueId'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    Acknowledgment:
      type: object
      additionalProperties: false
      required:
      - fieldId
      - rowPath
      - expectedContentHash
      - accepted
      properties:
        fieldId:
          type: string
          minLength: 1
        rowPath:
          $ref: '#/components/schemas/RuntimeRowPath'
        expectedContentHash:
          $ref: '#/components/schemas/ReviewDigest'
        accepted:
          const: true
    SessionMutation:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - value
        properties:
          op:
            const: set
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
          value:
            $ref: '#/components/schemas/InputAnswerValue'
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        properties:
          op:
            const: clear
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - reason
        properties:
          op:
            const: markInvalid
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
          reason:
            const: UNPARSEABLE_INPUT
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - itemId
        properties:
          op:
            const: addItem
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
          itemId:
            $ref: '#/components/schemas/OpaqueId'
          initialFields:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/InputAnswerValue'
            default: {}
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - itemId
        properties:
          op:
            const: removeItem
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
          itemId:
            $ref: '#/components/schemas/OpaqueId'
      - type: object
        additionalProperties: false
        required:
        - op
        - fieldId
        - itemId
        properties:
          op:
            const: moveItem
          fieldId:
            type: string
            minLength: 1
          rowPath:
            $ref: '#/components/schemas/RuntimeRowPath'
          itemId:
            $ref: '#/components/schemas/OpaqueId'
          beforeItemId:
            anyOf:
            - $ref: '#/components/schemas/OpaqueId'
            - type: 'null'
      discriminator:
        propertyName: op
    SubmissionFilter:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: array
          minItems: 1
          items:
            enum:
            - submitted
            - voided
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    PublishedSchema:
      type: object
      additionalProperties: true
      required:
      - $schema
      - $id
      properties: {}
      description: A complete Draft 2020-12 schema document. Keywords, $defs, recursive references and extension annotations
        are intentionally preserved.
    CapabilityRegistry:
      type: object
      additionalProperties: false
      required:
      - registryVersion
      - contractVersion
      - versions
      - schemas
      - fieldCatalog
      - controlValueCompatibility
      - operatorSignatures
      - limits
      - operations
      - assetSupplement
      - openapi
      - generation
      - fieldTypes
      - operators
      - apiContractVersion
      - schemaContractVersion
      - apiContracts
      properties:
        registryVersion:
          type: string
        contractVersion:
          const: 4.0.0
        versions:
          type: object
          required:
          - contract
          - openapi
          - schemaDialect
          - java
          - typescript
          additionalProperties:
            type: string
        schemas:
          type: array
          minItems: 7
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - version
            - id
            - sha256
            - file
            - resource
            properties:
              kind:
                type: string
              version:
                const: 4.0.0
              id:
                type: string
              sha256:
                $ref: '#/components/schemas/Sha256'
              file:
                type: string
              resource:
                type: string
        fieldCatalog:
          type: array
          minItems: 17
          items:
            type: object
            additionalProperties: false
            required:
            - row
            - controls
            - canonicalTypes
            properties:
              row:
                type: integer
                minimum: 1
              controls:
                type: array
                minItems: 1
                items:
                  type: string
              canonicalTypes:
                type: array
                items:
                  type: string
        controlValueCompatibility:
          type: object
          minProperties: 17
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
        operatorSignatures:
          type: array
          minItems: 34
          items:
            type: object
        limits:
          type: array
          minItems: 11
          items:
            type: object
        operations:
          type: object
          additionalProperties: false
          required:
          - count
          - items
          - statusPolicy
          properties:
            count:
              const: 82
            items:
              type: array
              minItems: 82
              items:
                type: object
            statusPolicy:
              type: string
        assetSupplement:
          type: object
          additionalProperties: false
          required:
          - counted
          - id
          - implementationStatus
          - reason
          properties:
            counted:
              const: false
            id:
              const: M2-get-v1-workspaces-w-assets-assetid-authorized-asset
            implementationStatus:
              const: planned
            reason:
              type: string
        openapi:
          type: object
          additionalProperties: false
          required:
          - file
          - resource
          - sha256
          - version
          properties:
            file:
              type: string
            resource:
              type: string
            sha256:
              $ref: '#/components/schemas/Sha256'
            version:
              const: 3.1.0
        generation:
          type: object
          minProperties: 1
          additionalProperties:
            type:
            - string
            - object
            - array
        fieldTypes:
          type: array
          minItems: 1
          items:
            type: string
          deprecated: true
          description: M1 compatibility alias derived from fieldCatalog; use fieldCatalog for catalog metadata.
        operators:
          type: array
          minItems: 1
          items:
            type: string
          deprecated: true
          description: M1 compatibility alias derived from operatorSignatures; use operatorSignatures for arity metadata.
        apiContractVersion:
          const: 4.1.0
        schemaContractVersion:
          const: 4.0.0
        apiContracts:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - version
            - sha256
            - resource
            properties:
              version:
                enum:
                - 4.0.0
                - 4.1.0
              sha256:
                $ref: '#/components/schemas/Sha256'
              resource:
                type: string
        xGeneratedEventModel:
          $ref: '#/components/schemas/EventDocument'
    SafeAccountIdentity:
      type: object
      additionalProperties: false
      required:
      - accountId
      - username
      - displayName
      properties:
        accountId:
          $ref: '#/components/schemas/OpaqueId'
        username:
          type: string
          minLength: 1
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 120
      description: Safe staff identity; it excludes passwords, hashes, bearer credentials and session secrets.
    PermittedWorkspaceChoice:
      type: object
      additionalProperties: false
      required:
      - workspaceId
      - name
      - roles
      properties:
        workspaceId:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 160
        roles:
          type: array
          minItems: 1
          items:
            enum:
            - administrator
            - author
            - reviewer
            - translator
            - publisher
            - response-viewer
            - response-exporter
            - auditor
    PermittedOrganizationChoice:
      type: object
      additionalProperties: false
      required:
      - organizationId
      - name
      - membershipState
      - workspaces
      properties:
        organizationId:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 160
        membershipState:
          const: active
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/PermittedWorkspaceChoice'
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
      - safeIdentity
      - activationState
      - accountStatus
      - organizations
      - currentOrganizationId
      properties:
        safeIdentity:
          $ref: '#/components/schemas/SafeAccountIdentity'
        activationState:
          enum:
          - awaiting-setup
          - active
        accountStatus:
          const: active
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/PermittedOrganizationChoice'
        currentOrganizationId:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
      description: Authenticated safe identity, activation state and server-authorized organization/workspace choices.
      if:
        properties:
          activationState:
            const: awaiting-setup
        required:
        - activationState
      then:
        properties:
          organizations:
            maxItems: 0
          currentOrganizationId:
            type: 'null'
    Form:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - revision
      - status
      - createdAt
      - updatedAt
      - formKey
      - title
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          const: Form
        revision:
          type: integer
          minimum: 0
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        formKey:
          type: string
        title:
          type: string
      description: Concrete Form resource representation.
    Draft:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - revision
      - status
      - createdAt
      - updatedAt
      - formId
      - packageHash
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          const: Draft
        revision:
          type: integer
          minimum: 0
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        formId:
          $ref: '#/components/schemas/OpaqueId'
        packageHash:
          $ref: '#/components/schemas/Sha256'
      description: Concrete Draft resource representation.
    Release:
      type: object
      additionalProperties: false

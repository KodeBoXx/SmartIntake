spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartintake}
    username: ${DATABASE_USER:smartintake}
    password: ${DATABASE_PASSWORD:smartintake}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
smartintake:
  bootstrap-token: test-bootstrap-token
  trusted-proxy-addresses: 127.0.0.1
  security:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200,https://embed.example.test,https://denied.example.test

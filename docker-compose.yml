services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartintake
      POSTGRES_USER: smartintake
      POSTGRES_PASSWORD: smartintake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartintake -d smartintake"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
